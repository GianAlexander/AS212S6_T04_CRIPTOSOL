<div class="card-body">
  <section class="web3-interaction mt-5 pt-5">
    <div class="container text-center">
      <div class="section-title text-center" data-aos="fade-up">
        <h2>Interacción con Web 3.0</h2>
        <p>Gestiona tus transferencias y tu cuenta en Web 3.0</p>
      </div>
      <div class="row mt-5 justify-content-center">
        <!-- Transferencias -->
        <div class="col-lg-4 col-md-6 mb-4" data-aos="fade-up" data-aos-delay="100">
          <div class="card p-4">
            <h3 class="card-title">Transferencias</h3>
            <form [formGroup]="transactionForm" (ngSubmit)="sendTransaction()">
              <div class="form-group mt-4 text-left">
                <label for="toAddress">Dirección del destinatario:</label>
                <input type="text" id="toAddress" class="form-control" formControlName="toAddress" placeholder="0x...">
              </div>
              <div class="form-group mt-3 text-left">
                <label for="amount">Monto (ETH):</label>
                <input type="number" id="amount" class="form-control" formControlName="amount" placeholder="0.00">
              </div>
              <button type="submit" class="btn btn-success mt-4" [disabled]="transactionForm.invalid">ENVIAR</button>
            </form>
            <div *ngIf="transactionStatus" class="mt-3 text-left">
              <p [ngClass]="{'text-success': transactionSuccess, 'text-danger': !transactionSuccess}">{{ transactionStatus }}</p>
            </div>
          </div>
        </div>

        <!-- Web 3.0 -->
        <div class="col-lg-4 col-md-6 mb-4" data-aos="fade-up" data-aos-delay="200">
          <div class="card p-4">
            <h3 class="card-title">ENTRA A LA WEB 3.0</h3>
            <div class="form-group mt-4 text-left">
              <label for="accountAddress">TU CUENTA:</label>
              <textarea id="accountAddress" class="form-control" disabled>{{ address }}</textarea>
            </div>
            <div class="form-group mt-3 text-left">
              <label for="accountBalance">TU ETH:</label>
              <textarea id="accountBalance" class="form-control" disabled>{{ balance | number:'1.4-4' }}</textarea>
            </div>
            <button type="button" class="btn btn-primary mt-4" (click)="connectWallet()">Conectar MetaMask</button>
          </div>
        </div>
      </div>

      <div class="text-center mt-4">
        <button type="button" class="btn btn-danger" (click)="disconnectWallet()">Salir de la web3</button>
      </div>
    </div>
  </section>
</div>
